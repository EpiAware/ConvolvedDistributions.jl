name: Documenter

on:
  push:
    branches: main
    tags: '*'
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Documenter:
    uses: EpiAware/.github/.github/workflows/documentation.yml@2c7ce73459772f11dad46ac7f456e35f0d296faf
    # The reusable's own default is 45 minutes. This build runs the
    # AD-backend tutorials and a full linkcheck, and lands at 40-42
    # minutes on a normal run, so the default leaves no headroom for a
    # slower runner or a slow linkcheck pass.
    with:
      timeout_minutes: 90
    secrets: inherit  # pragma: allowlist secret
